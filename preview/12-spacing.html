<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--paper);font-family:var(--font-en-body);color:var(--ink)}
  .row{display:flex;gap:12px;align-items:center;margin-bottom:8px}
  .bar{background:var(--hadaf-green);height:14px;border-radius:2px}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:80px}
</style>
</head>
<body>
  <div class="row"><span class="lbl">--sp-1 · 4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="lbl">--sp-2 · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="lbl">--sp-3 · 12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="lbl">--sp-4 · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="lbl">--sp-6 · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="lbl">--sp-8 · 40</span><span class="bar" style="width:40px"></span></div>
  <div class="row"><span class="lbl">--sp-10 · 64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="lbl">--sp-12 · 96</span><span class="bar" style="width:96px"></span></div>
</body>
</html>
