<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>Type — Arabic display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{height:100%}
  body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;gap:12px}
  .label{font-family:var(--font-en-body);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);line-height:1}
  .display{font-family:var(--font-ar-display);font-weight:900;font-size:44px;line-height:1.15;letter-spacing:-.01em;margin:0}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);line-height:1.4}
</style>
</head>
<body>
  <div class="label">Display · Cairo 900</div>
  <div class="display">ليلة تاريخية في الرياض</div>
  <div class="meta">Cairo · 900 · 44/51 · -1% tracking · عناوين الهيرو والمقالات الرئيسية</div>
</body>
</html>
