<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>Article card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-ar-body);color:var(--ink)}
  .card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-1);max-width:600px;display:grid;grid-template-columns:200px 1fr;gap:0}
  .img{background:#0E2B22;background-image:url("../assets/imagery/match-action-1.svg");background-size:cover;background-position:center}
  .body{padding:14px 16px}
  .kicker{font-family:var(--font-en-body);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hadaf-green);margin-bottom:6px}
  h3{font-family:var(--font-ar-display);font-weight:800;font-size:20px;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
  .meta{font-size:12px;color:var(--fg-3);font-family:var(--font-ar-body)}
</style>
</head>
<body>
  <article class="card">
    <div class="img"></div>
    <div class="body">
      <div class="kicker">دوري روشن</div>
      <h3>الهلال يكتسح النصر في ديربي الرياض</h3>
      <div class="meta">قبل ساعتين · ٤ دقائق قراءة</div>
    </div>
  </article>
</body>
</html>
