<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Mono / scores</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--ink);color:var(--paper);font-family:var(--font-en-body)}
  .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-on-dark-2);margin-bottom:14px}
  .row{display:flex;gap:32px;align-items:baseline}
  .score{font-family:var(--font-mono);font-weight:700;font-size:64px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .clock{font-family:var(--font-mono);font-weight:500;font-size:18px;color:var(--hadaf-gold)}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-on-dark-2);margin-top:14px}
</style>
</head>
<body>
  <div class="label">Mono · JetBrains Mono · scores + stats</div>
  <div class="row">
    <div class="score">2 — 1</div>
    <div class="clock">78'</div>
    <div class="score" style="font-size:32px">90 + 3</div>
  </div>
  <div class="meta">tabular-nums · scores 64/64 · clock 18/24</div>
</body>
</html>
