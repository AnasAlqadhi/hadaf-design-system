<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Latin display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--paper);color:var(--ink)}
  .label{font-family:var(--font-en-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:6px}
  .display{font-family:var(--font-en-display);font-weight:400;font-size:64px;line-height:1.0;letter-spacing:.01em;text-transform:uppercase}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:8px}
</style>
</head>
<body>
  <div class="label">Display · Bebas Neue</div>
  <div class="display">A historic night in Riyadh</div>
  <div class="meta">Bebas Neue · 400 · 64/64 · sport-magazine headlines</div>
</body>
</html>
