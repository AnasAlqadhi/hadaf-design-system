<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>Score chip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--paper);font-family:var(--font-ar-body);color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .match{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;box-shadow:var(--shadow-1)}
  .team{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
  .team.away{flex-direction:row-reverse;justify-content:flex-start}
  .team img{width:32px;height:32px}
  .score{font-family:var(--font-mono);font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--ink);min-width:64px;text-align:center}
  .live-time{font-family:var(--font-mono);font-size:11px;color:var(--live-red);font-weight:700;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
  .live-time::before{content:"مباشر";font-family:var(--font-ar-body);font-size:10px;letter-spacing:.04em}
  .ft{font-family:var(--font-en-body);font-size:11px;color:var(--fg-3);font-weight:700}
</style>
</head>
<body>
  <div class="grid">
    <div class="match">
      <div class="team"><img src="../assets/crests/team-blue.svg" alt=""><span>الهلال</span></div>
      <div><div class="score">2 — 1</div><div class="live-time">78'</div></div>
      <div class="team away"><img src="../assets/crests/team-yellow.svg" alt=""><span>النصر</span></div>
    </div>
    <div class="match">
      <div class="team"><img src="../assets/crests/team-black.svg" alt=""><span>الاتحاد</span></div>
      <div><div class="score">3 — 0</div><div class="ft">انتهت</div></div>
      <div class="team away"><img src="../assets/crests/team-red.svg" alt=""><span>الأهلي</span></div>
    </div>
  </div>
</body>
</html>
