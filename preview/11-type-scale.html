<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:18px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-ar-display)}
  .row{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--border);padding:6px 0}
  .row:last-child{border:none}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);width:60px;flex:none}
  .ex{font-weight:800}
</style>
</head>
<body>
  <div class="row"><span class="tag">H1 · 48</span><span class="ex" style="font-size:48px">عنوان رئيسي</span></div>
  <div class="row"><span class="tag">H2 · 32</span><span class="ex" style="font-size:32px;font-weight:700">عنوان فرعي</span></div>
  <div class="row"><span class="tag">H3 · 20</span><span class="ex" style="font-size:20px;font-weight:700">عنوان قسم</span></div>
  <div class="row"><span class="tag">Body · 16</span><span class="ex" style="font-size:16px;font-weight:400;font-family:var(--font-ar-body)">نص المقال الأساسي</span></div>
  <div class="row"><span class="tag">Caption · 13</span><span class="ex" style="font-size:13px;font-family:var(--font-ar-body);color:var(--fg-3)">تعليق صغير</span></div>
</body>
</html>
