<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>Imagery treatment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Bebas+Neue&family=Inter:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Cairo',var(--font-ar-body)}
  .hero{position:relative;width:100%;height:100%;min-height:300px;overflow:hidden;background:#082E1D;isolation:isolate}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.08) brightness(.85);z-index:1}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,46,29,.15) 0%,rgba(11,15,13,.45) 55%,rgba(11,15,13,.95) 100%);z-index:2}
  .content{position:absolute;inset-block-end:0;inset-inline:0;padding:24px 28px 26px;color:#FAF7F1;z-index:3}
  .kicker{font-family:'Bebas Neue','Inter',sans-serif;font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#D4A437;margin-bottom:10px;display:inline-block}
  .kicker .dot{display:inline-block;width:5px;height:5px;background:#D4A437;border-radius:50%;margin:0 6px;vertical-align:middle}
  h1{font-family:'Cairo','Tahoma',sans-serif;font-weight:900;font-size:38px;line-height:1.18;letter-spacing:-.005em;margin:0;color:#FAF7F1;text-shadow:0 2px 12px rgba(0,0,0,.35)}
</style>
</head>
<body>
  <div class="hero">
    <img class="bg" src="../assets/imagery/match-action-1.svg" alt="">
    <div class="scrim"></div>
    <div class="content">
      <div class="kicker">حصري<span class="dot"></span>ديربي الرياض</div>
      <h1>ليلة لا تُنسى يكتبها الهلال</h1>
    </div>
  </div>
</body>
</html>
