<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-en-body)}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:18px;text-align:center}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
  .item svg, .item img{width:24px;height:24px;color:var(--ink)}
  .lbl{font-family:var(--font-mono);font-size:9px;color:var(--fg-3)}
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 12 2-9h14l2 9-9 9z"/></svg><span class="lbl">home</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">search</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v6a6 6 0 0 0 12 0V2"/><path d="M6 22v-6a6 6 0 0 1 12 0v6"/></svg><span class="lbl">whistle</span></div>
    <div class="item"><img src="../assets/icons/sport/ball.svg" alt=""><span class="lbl">ball</span></div>
    <div class="item"><img src="../assets/icons/sport/jersey.svg" alt=""><span class="lbl">jersey</span></div>
    <div class="item"><img src="../assets/icons/sport/pitch.svg" alt=""><span class="lbl">pitch</span></div>
    <div class="item"><img src="../assets/icons/sport/trophy-shield.svg" alt=""><span class="lbl">trophy</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 4 9 8 10 4-1 8-5 8-10V6Z"/></svg><span class="lbl">shield</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lbl">clock</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.5 6 6.5.5-5 4 1.5 6.5L12 17l-5.5 3 1.5-6.5-5-4 6.5-.5z"/></svg><span class="lbl">star</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c-1.5 1.5-3 2-5 2s-3.5-.5-5-2"/><path d="M9 10h.01M15 10h.01"/><circle cx="12" cy="12" r="9"/></svg><span class="lbl">fan</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span class="lbl">menu</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 16 4-5h-3V4h-2v7H8z"/><path d="M5 20h14"/></svg><span class="lbl">share</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 17l-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="lbl">save</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 8 6 4-6 4z" fill="currentColor"/></svg><span class="lbl">play</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11c0 6-9 11-9 11S3 17 3 11a9 9 0 1 1 18 0Z"/><circle cx="12" cy="11" r="3"/></svg><span class="lbl">stadium</span></div>
  </div>
</body>
</html>
