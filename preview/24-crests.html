<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>Crests</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-ar-body)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:center}
  .item img{width:64px;height:64px}
  .lbl{margin-top:8px;font-size:13px;font-weight:700}
  .meta{font-family:var(--font-mono);font-size:9px;color:var(--fg-3);margin-top:2px}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><img src="../assets/crests/team-blue.svg" alt=""><div class="lbl">الهلال</div><div class="meta">placeholder</div></div>
    <div class="item"><img src="../assets/crests/team-yellow.svg" alt=""><div class="lbl">النصر</div><div class="meta">placeholder</div></div>
    <div class="item"><img src="../assets/crests/team-black.svg" alt=""><div class="lbl">الاتحاد</div><div class="meta">placeholder</div></div>
    <div class="item"><img src="../assets/crests/team-red.svg" alt=""><div class="lbl">الأهلي</div><div class="meta">placeholder</div></div>
  </div>
</body>
</html>
