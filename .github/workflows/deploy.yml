name: Deploy Hadaf to GitHub Pages

# Runs on every push to main, every 6 hours (keeps news fresh),
# and can be triggered manually from the GitHub Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit updated data/feed.json back to repo
  pages: write
  id-token: write

# Only one deploy at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 1: Run the news pipeline ──────────────────────────────────────
      # Fetches RSS, rewrites articles in Arabic via Claude Haiku,
      # saves to data/feed.json which the static site loads directly.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pipeline dependencies
        run: npm install

      - name: Run news pipeline (fetch + rewrite)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/fetch-rewrite.mjs
          echo "Pipeline complete"

      # ── Step 2: Commit updated feed.json if it changed ─────────────────────
      - name: Commit updated feed.json
        run: |
          git config user.name  "hadaf-bot"
          git config user.email "hadaf-bot@users.noreply.github.com"
          git add data/feed.json
          if git diff --staged --quiet; then
            echo "No changes to feed.json — skipping commit"
          else
            ARTICLE_COUNT=$(node -e "const f=require('./data/feed.json');console.log(f.count)")
            git commit -m "chore(data): auto-update feed.json [${ARTICLE_COUNT} articles] [skip ci]"
            git push
            echo "✅ Committed updated feed.json"
          fi

      # ── Step 3: Inject browser API keys into config.js ─────────────────────
      - name: Inject API config
        env:
          API_FOOTBALL_KEY:    ${{ secrets.API_FOOTBALL_KEY }}
          SPORTMONKS_KEY:      ${{ secrets.SPORTMONKS_KEY }}
          YOUTUBE_KEY:         ${{ secrets.YOUTUBE_KEY }}
          YOUTUBE_CHANNEL_ID:  ${{ secrets.YOUTUBE_CHANNEL_ID }}
          BUTTONDOWN_USERNAME: ${{ secrets.BUTTONDOWN_USERNAME }}
        run: |
          cat > site/config.js << EOF
          // Auto-generated by GitHub Actions — do not edit manually.
          window.HADAF_CONFIG = {
            API_FOOTBALL_KEY:    '${API_FOOTBALL_KEY}',
            SPORTMONKS_KEY:      '${SPORTMONKS_KEY}',
            YOUTUBE_KEY:         '${YOUTUBE_KEY}',
            YOUTUBE_CHANNEL_ID:  '${YOUTUBE_CHANNEL_ID}',
            BUTTONDOWN_USERNAME: '${BUTTONDOWN_USERNAME}',
          };
          EOF
          echo "✅ config.js generated"

      # ── Step 4: Deploy to GitHub Pages ─────────────────────────────────────
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
