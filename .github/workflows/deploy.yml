name: Deploy Hadaf to GitHub Pages

# Runs on every push to main, every 6 hours (keeps news/scores fresh),
# and can be triggered manually from the GitHub Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Inject real API keys from GitHub Secrets into site/config.js
      # The file is gitignored so keys are never stored in the repo.
      - name: Inject API config
        env:
          API_FOOTBALL_KEY:    ${{ secrets.API_FOOTBALL_KEY }}
          SPORTMONKS_KEY:      ${{ secrets.SPORTMONKS_KEY }}
          YOUTUBE_KEY:         ${{ secrets.YOUTUBE_KEY }}
          YOUTUBE_CHANNEL_ID:  ${{ secrets.YOUTUBE_CHANNEL_ID }}
          BUTTONDOWN_USERNAME: ${{ secrets.BUTTONDOWN_USERNAME }}
        run: |
          cat > site/config.js << EOF
          // Auto-generated by GitHub Actions — do not edit manually.
          // Set secrets in: GitHub repo → Settings → Secrets and variables → Actions
          window.HADAF_CONFIG = {
            API_FOOTBALL_KEY:    '${API_FOOTBALL_KEY}',
            SPORTMONKS_KEY:      '${SPORTMONKS_KEY}',
            YOUTUBE_KEY:         '${YOUTUBE_KEY}',
            YOUTUBE_CHANNEL_ID:  '${YOUTUBE_CHANNEL_ID}',
            BUTTONDOWN_USERNAME: '${BUTTONDOWN_USERNAME}',
          };
          EOF
          echo "✅ config.js generated"
          echo "API_FOOTBALL_KEY length:    ${#API_FOOTBALL_KEY}"
          echo "SPORTMONKS_KEY length:      ${#SPORTMONKS_KEY}"
          echo "YOUTUBE_KEY length:         ${#YOUTUBE_KEY}"
          echo "YOUTUBE_CHANNEL_ID length:  ${#YOUTUBE_CHANNEL_ID}"
          echo "BUTTONDOWN_USERNAME length: ${#BUTTONDOWN_USERNAME}"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
